name: Lean contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lean:
    name: Lake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1

      - name: Build Lean contracts
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen llvm

      - name: Install wasi-sdk
        run: |
          curl -sL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-32/wasi-sdk-32.0-x86_64-linux.tar.gz \
            | tar xz -C /opt
          echo "HOOKZ_WASI_SDK=/opt/wasi-sdk-32.0-x86_64-linux" >> $GITHUB_ENV

      - name: Clone xahaud hook headers (sparse)
        run: |
          git clone --depth 1 -b dev https://github.com/Xahau/xahaud.git /tmp/xahaud
          echo "HOOKZ_XAHAUD=/tmp/xahaud" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: uv sync

      - name: Check dev directive Lean dispatch
        run: uv run pytest tests/test_dev_directives.py -q

      - name: Check generated Lean runtime cases
        run: uv run python scripts/lean_contract_smoke.py
