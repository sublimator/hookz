[lean4.accept_incoming_xah]
adapter = "accept_incoming_xah"
model = "Hookz.Contracts.BasicNative.AcceptIncomingXah.expected"
status = "modeled"

[lean4.reject_incoming_xah]
adapter = "reject_incoming_xah"
model = "Hookz.Contracts.BasicNative.RejectIncomingXah.expected"
status = "modeled"

[lean4.accept_incoming_min]
adapter = "accept_incoming_min"
