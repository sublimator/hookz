[paths]
xahaud = "../../../xahaud-worktrees/xahaud-wasm-coverage"
wasi_sdk = "~/.local/share/mise/installs/wasi-sdk/32/wasi-sdk"

[compile]
extra_cflags = ["-Ihooks/misc"]

[hooks]
# Genesis hooks (from Xahau/xahaud)
govern = "hooks/genesis/govern.c"
mint = { source = "hooks/genesis/mint.c", lean = "../../lean/Hookz/Contracts/Mint.lean" }
nftoken = "hooks/genesis/nftoken.c"
reward = { source = "hooks/genesis/reward.c", lean = "../../lean/Hookz/Contracts/Reward.lean" }

# Misc hooks
balance_gate = { source = "hooks/misc/balance_gate.c", lean = "../../lean/Hookz/Contracts/BalanceGate.lean" }
treasury = { source = "hooks/misc/treasury.c", lean = "../../lean/Hookz/Contracts/Treasury.lean" }

# XahauHooks101 examples (github.com/Handy4ndy/XahauHooks101)
accept_incoming_xah = { source = "hooks/XahauHooks101/Basic_Native/Accept_Incoming_Payment/accept_incoming_xah.c", lean = "../../lean/Hookz/Contracts/BasicNative.lean" }
reject_incoming_xah = { source = "hooks/XahauHooks101/Basic_Native/Reject_Incoming_Payment/reject_incoming_xah.c", lean = "../../lean/Hookz/Contracts/BasicNative.lean" }
accept_incoming_min = "hooks/XahauHooks101/Basic_Native/Accept_Incoming_Payment/accept_incoming_min.c"
reject_incoming_max = "hooks/XahauHooks101/Basic_Native/Reject_Incoming_Payment/reject_incoming_max.c"
state_counter = { source = "hooks/XahauHooks101/Basic_State/basic_state_counter.c", lean = "../../lean/Hookz/Contracts/StateCounter.lean" }
state_toggle = { source = "hooks/XahauHooks101/Basic_State/basic_state_toggle.c", lean = "../../lean/Hookz/Contracts/StateToggle.lean" }
install_param = "hooks/XahauHooks101/Basic_Install_Parameters/install_parameter_exact.c"
invoke_param = "hooks/XahauHooks101/Basic_Invoke_Parameters/invoke_parameter_exact.c"
multi_iou_remit = "hooks/XahauHooks101/Remit_IOU/invoke_multi_iou_remit.c"
multi_uri_remit = "hooks/XahauHooks101/Remit_URI/invoke_multi_uri_remit.c"
multi_invoke_emit = { source = "hooks/XahauHooks101/Emit_Invoke/invoke_multi_invoke_emit.c", lean = "../../lean/Hookz/Contracts/MultiInvokeEmit.lean" }
