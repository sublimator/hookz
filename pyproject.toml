[project]
name = "hookz"
version = "0.1.0"
description = "WASM hook testing framework — execute, instrument, and assert on Xahau hooks from Python"
requires-python = ">=3.12"
dependencies = [
    "wasmtime>=42",
    "tree-sitter>=0.24",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    "rich>=14",
    "xrpl-py>=4",
    "wasm-tob>=1.0.1",
    "click>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
hookz = "hookz.cli.main:main"

[project.entry-points."pytest11"]
hookz = "hookz.testing.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hookz"]

# force-include removed for xahaud_lite: packages=["src/hookz"] already ships
# it (double-include broke hatchling wheel: error.h twice).
#
# The patch is different — it lives outside src/hookz, so there is no double
# include, and `hookz env-test-context` inlines it. Without this the command
# degraded to "could not read …" on every wheel install while printing a
# `git apply` line naming a path that does not exist.
[tool.hatch.build.targets.wheel.force-include]
"patches/xahaud-external-env-tests.patch" = "hookz/data/xahaud-external-env-tests.patch"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "componentize-py>=0.24.0",
    "pillow>=12.2.0",
    "pytest-cov>=7.1.0",
    "wasm-tob>=1.0.1",
]
